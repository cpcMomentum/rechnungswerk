name: node

# Frontend-Gate: Lint + Typecheck + vitest + Produktions-Build muessen gruen sein.
# Laeuft auf ALLEN PRs (kein paths-Filter): als Required-Status-Check muss der
# Workflow immer melden, sonst blockiert ein nie-startender Check den Merge.
# (--passWithNoTests bleibt als Auffangnetz, es gibt inzwischen 71 Vitest-Tests.)

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Volle Historie: der Bundle-Check diffst gegen den Ziel-Branch
          # und braucht die Merge-Base.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          # Node 24 statt 20: @nextcloud/eslint-config 9 nutzt findPackageJSON aus
          # node:module, das es erst ab 22.14 gibt (engines: ^22.14 || ^24 || >=26).
          # Unter Node 20 bricht der Lint mit einem SyntaxError ab — lokal fiel das
          # nicht auf, weil dort Node 26 laeuft.
          node-version: '24'

      - name: Abhaengigkeiten installieren
        # npm/cli#4828: ein auf anderem OS erzeugter Lock laesst das plattform-
        # spezifische rollup-Binary fehlen. Lock entfernen erzwingt frische,
        # plattform-korrekte Aufloesung auf dem Linux-Runner.
        run: |
          rm -f package-lock.json
          npm install --no-audit --no-fund

      # Bis 08.08.2026 hiess dieser Job "lint-and-build", ohne je zu linten
      # (#210): das Paket war deklariert, aber es gab keine Konfiguration, kein
      # Skript und keinen Schritt. Ein Pruefschritt, der nichts prueft, ist
      # schlechter als keiner, weil er beruhigt.
      - name: Lint
        run: npm run lint

      # Faengt Strings ab, die in t()/->t() stehen, aber in keiner l10n-Datei.
      # Solche Texte fallen in JEDER Sprache auf den deutschen Quelltext zurueck
      # und bleiben beim Entwickeln unsichtbar, weil auf Deutsch getestet wird.
      # Ergaenzt l10nCompleteness.spec.ts, siehe dortigen Kopf.
      # Faengt vergessene Frontend-Builds. Kein Byte-Diff — der Build ist in der
      # CI nicht reproduzierbar (contractmanager#251): der Lock wird verworfen
      # und die Node-Version weicht ab, ein Rebuild ohne Quelltextaenderung
      # erzeugt schon andere Minifier-Kuerzel. Stattdessen: wurden Eingaben
      # geaendert, ohne dass sich js/ und css/ geaendert haben? Genau so blieb
      # bei contractmanager#327 eine verwundbare Abhaengigkeit im
      # ausgelieferten Bundle stehen.
      - name: Bundle aktuell
        if: github.event_name == 'pull_request'
        env:
          # Nicht direkt in run: interpolieren — ein Branch-Name kann
          # Shell-Metazeichen enthalten (Script-Injection).
          BASE_REF: ${{ github.base_ref }}
        run: npx --no-install nc-bundle-check "origin/$BASE_REF"

      - name: l10n-Vollstaendigkeit
        run: npm run l10n:check

      - name: Typecheck
        run: npm run typecheck

      - name: Frontend-Unit-Tests (vitest)
        run: npm test -- --passWithNoTests

      - name: Produktions-Build
        run: npm run build
